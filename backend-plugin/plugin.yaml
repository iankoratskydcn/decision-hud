name: decision-hud
version: "0.1.0"
description: >
  Cross-project Decision HUD: a durable queue of bounded owner decisions
  (MCQ-style) any agent can push into, cleared one at a time via a docked
  card-stack UI. Agents write through the companion MCP server; the desktop
  pane drives `hermes decision ...` CLI commands over SQLite.
author: "Ian Koratsky"
kind: standalone
platforms:
  - linux
  - macos
  - windows
